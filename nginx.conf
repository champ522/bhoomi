# ============================================
# Nginx Configuration for Bhoomi Techzone
# Production-Ready with Complete Optimization
# ============================================

# HTTP to HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name bhoomitechzone.in www.bhoomitechzone.in;

    return 301 https://bhoomitechzone.in$request_uri;
}

# WWW to non-WWW Redirect (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bhoomitechzone.in;

    return 301 https://bhoomitechzone.in$request_uri;
}

# ============================================
# MAIN SERVER CONFIG
# ============================================

server {

    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name bhoomitechzone.in;

    root /www/wwwroot/BhoomiTechzoneWebsite/bhoomi/bhoomi/dist;

    index index.html;

    # ============================================
    # GZIP COMPRESSION
    # ============================================

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;

    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        font/woff
        font/woff2
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/x-component;

    # ============================================
    # SECURITY HEADERS
    # ============================================

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: https: blob:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-XSS-Protection "1; mode=block" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    server_tokens off;

    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    # ============================================
    # CACHING RULES
    # ============================================

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {

        expires 365d;

        add_header Cache-Control "public, immutable";

        access_log off;
    }

    # ONLY real index.html
    location = /index.html {

        expires -1;

        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";

        add_header Pragma "no-cache";
    }

    # Service Worker
    location = /sw.js {

        expires off;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # XML & TXT files
    location ~* \.(xml|txt)$ {

        expires 1d;

        add_header Cache-Control "public, max-age=86400";
    }

    # ============================================
    # FILE PROTECTION
    # ============================================

    # Hidden files
    location ~ /\. {

        deny all;

        access_log off;

        log_not_found off;
    }

    # Sensitive files
    location ~* /(?:\.git|\.svn|\.hg|\.env|package\.json|package-lock\.json|composer\.json|composer\.lock) {

        deny all;

        access_log off;

        log_not_found off;
    }

    # Block node_modules
    location ~* /node_modules/ {

        deny all;

        access_log off;

        log_not_found off;
    }

    # ============================================
    # BLOCK FAKE URLS
    # ============================================

    # Block ALL PHP URLs
    location ~ \.php$ {

        return 404;
    }

    # Block ALL HTML URLs except real index.html
    location ~ \.html$ {

        if ($request_uri != "/index.html") {

            return 404;
        }
    }

    # ============================================
    # SPA ROUTING
    # ============================================

    location / {

        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # ROBOTS & SITEMAP
    # ============================================

    location = /robots.txt {

        access_log off;

        log_not_found off;
    }

    location = /sitemap.xml {

        access_log off;

        log_not_found off;
    }

    # ============================================
    # ERROR PAGES
    # ============================================

    error_page 500 502 503 504 /index.html;
}