<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap Viewer - Bhoomi Techzone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .search-box:focus {
            outline: none;
            border-color: #28a745;
        }

        .filter-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #e9ecef;
            color: #495057;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: #dee2e6;
        }

        .filter-btn.active {
            background: #28a745;
            color: white;
        }

        .url-list {
            padding: 30px;
            max-height: 600px;
            overflow-y: auto;
        }

        .url-group {
            margin-bottom: 30px;
        }

        .group-header {
            font-size: 1.3rem;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 3px solid #28a745;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-count {
            background: #28a745;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .url-item {
            background: #f8f9fa;
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .url-item:hover {
            background: #e9ecef;
            border-left-color: #28a745;
            transform: translateX(5px);
        }

        .url-link {
            color: #495057;
            text-decoration: none;
            flex: 1;
            word-break: break-all;
            font-size: 0.95rem;
        }

        .url-link:hover {
            color: #28a745;
        }

        .url-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .priority-badge {
            background: #28a745;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 1.5rem;
            color: #6c757d;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #28a745;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 20px;
            margin: 30px;
            border-radius: 10px;
            text-align: center;
        }

        .quick-links {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .quick-link {
            padding: 10px 20px;
            background: white;
            border: 2px solid #28a745;
            color: #28a745;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .quick-link:hover {
            background: #28a745;
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .stat-card {
                padding: 15px;
            }
            
            .stat-number {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ Sitemap Viewer</h1>
            <p>Bhoomi Techzone - Complete URL Structure</p>
        </div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalUrls">-</div>
                <div class="stat-label">Total URLs</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="staticUrls">-</div>
                <div class="stat-label">Static Routes</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="blogUrls">-</div>
                <div class="stat-label">Blog Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="projectUrls">-</div>
                <div class="stat-label">Projects</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lmsUrls">-</div>
                <div class="stat-label">LMS Lessons</div>
            </div>
        </div>

        <div class="quick-links">
            <a href="/sitemap.xml" target="_blank" class="quick-link">📄 View Raw Sitemap</a>
            <a href="/robots.txt" target="_blank" class="quick-link">🤖 View Robots.txt</a>
            <a href="/" class="quick-link">🏠 Back to Home</a>
        </div>

        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search URLs...">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="static">Static</button>
            <button class="filter-btn" data-filter="blog">Blogs</button>
            <button class="filter-btn" data-filter="project">Projects</button>
            <button class="filter-btn" data-filter="lms">LMS</button>
        </div>

        <div class="url-list" id="urlList">
            <div class="loading">
                <div class="spinner"></div>
                Loading sitemap...
            </div>
        </div>
    </div>

    <script>
        let allUrls = [];
        let currentFilter = 'all';

        // Fetch and parse sitemap
        async function loadSitemap() {
            try {
                const response = await fetch('/sitemap.xml');
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                
                const urlElements = xmlDoc.getElementsByTagName('url');
                allUrls = Array.from(urlElements).map(url => ({
                    loc: url.getElementsByTagName('loc')[0].textContent,
                    lastmod: url.getElementsByTagName('lastmod')[0]?.textContent || '',
                    changefreq: url.getElementsByTagName('changefreq')[0]?.textContent || '',
                    priority: url.getElementsByTagName('priority')[0]?.textContent || ''
                }));

                updateStats();
                displayUrls(allUrls);
            } catch (error) {
                document.getElementById('urlList').innerHTML = `
                    <div class="error">
                        <h3>❌ Error Loading Sitemap</h3>
                        <p>${error.message}</p>
                        <p>Make sure the sitemap.xml exists in the public folder.</p>
                    </div>
                `;
            }
        }

        function updateStats() {
            const staticUrls = allUrls.filter(url => !url.loc.includes('/blog/') && !url.loc.includes('/project/') && !url.loc.includes('/lms/'));
            const blogUrls = allUrls.filter(url => url.loc.includes('/blog/'));
            const projectUrls = allUrls.filter(url => url.loc.includes('/project/'));
            const lmsUrls = allUrls.filter(url => url.loc.includes('/lms/course/'));

            document.getElementById('totalUrls').textContent = allUrls.length;
            document.getElementById('staticUrls').textContent = staticUrls.length;
            document.getElementById('blogUrls').textContent = blogUrls.length;
            document.getElementById('projectUrls').textContent = projectUrls.length;
            document.getElementById('lmsUrls').textContent = lmsUrls.length;
        }

        function displayUrls(urls) {
            const groups = {
                'Static Routes': urls.filter(url => !url.loc.includes('/blog/') && !url.loc.includes('/project/') && !url.loc.includes('/lms/')),
                'Blog Posts': urls.filter(url => url.loc.includes('/blog/')),
                'Projects': urls.filter(url => url.loc.includes('/project/')),
                'LMS Lessons': urls.filter(url => url.loc.includes('/lms/course/'))
            };

            let html = '';
            for (const [groupName, groupUrls] of Object.entries(groups)) {
                if (groupUrls.length > 0) {
                    html += `
                        <div class="url-group">
                            <div class="group-header">
                                <span>${groupName}</span>
                                <span class="group-count">${groupUrls.length}</span>
                            </div>
                    `;
                    
                    groupUrls.forEach(url => {
                        html += `
                            <div class="url-item">
                                <a href="${url.loc}" target="_blank" class="url-link">${url.loc}</a>
                                <div class="url-meta">
                                    <span class="priority-badge">Priority: ${url.priority}</span>
                                    <span>${url.changefreq}</span>
                                </div>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }
            }

            document.getElementById('urlList').innerHTML = html || '<div class="loading">No URLs found</div>';
        }

        // Search functionality
        document.getElementById('searchBox').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredUrls = allUrls.filter(url => url.loc.toLowerCase().includes(searchTerm));
            displayUrls(filterByType(filteredUrls));
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                
                const searchTerm = document.getElementById('searchBox').value.toLowerCase();
                let filteredUrls = searchTerm 
                    ? allUrls.filter(url => url.loc.toLowerCase().includes(searchTerm))
                    : allUrls;
                
                displayUrls(filterByType(filteredUrls));
            });
        });

        function filterByType(urls) {
            if (currentFilter === 'all') return urls;
            if (currentFilter === 'static') return urls.filter(url => !url.loc.includes('/blog/') && !url.loc.includes('/project/') && !url.loc.includes('/lms/'));
            if (currentFilter === 'blog') return urls.filter(url => url.loc.includes('/blog/'));
            if (currentFilter === 'project') return urls.filter(url => url.loc.includes('/project/'));
            if (currentFilter === 'lms') return urls.filter(url => url.loc.includes('/lms/'));
            return urls;
        }

        // Load sitemap on page load
        loadSitemap();
    </script>
</body>
</html>
