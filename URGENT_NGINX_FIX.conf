# URGENT: NGINX REDIRECT CONFIGURATION NEEDED
# Your hosting provider MUST add these rules to fix WWW canonicalization

# Add to your nginx server configuration:
# File location: Usually /etc/nginx/sites-available/bhoomitechzone.in

server {
    listen 80;
    listen 443 ssl;
    server_name www.bhoomitechzone.in;
    return 301 https://bhoomitechzone.in$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bhoomitechzone.in;
    
    # Your existing SSL configuration here
    
    root /www/wwwroot/BhoomiTechzoneWebsite/bhoomi/bhoomi/dist;
    index index.html;
    
    # Rest of your configuration...
}

# CRITICAL: Without this server-level redirect, 
# SEO tools will continue to see both www and non-www as 
# separate websites (HTTP 200 responses instead of 301 redirects)

# Contact your hosting provider with this exact configuration!